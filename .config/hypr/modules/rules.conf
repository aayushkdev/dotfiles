windowrule {
    name = float-pavu
    match:class = org.pulseaudio.pavucontrol

    float = on
    move = (cursor_x-(window_w*0.5))-210 (cursor_y-(window_h*0.5))+220
    size = 600 400
}

windowrule {
    name = float-blueman
    match:class = blueman-manager

    float = on
    move = (cursor_x-(window_w*0.5))-180 (cursor_y-(window_h*0.5))+220
    size = 600 400
}

windowrule {
    name = float-nm
    match:title = nmtui

    float = on
    move = (cursor_x-(window_w*0.5))-180 (cursor_y-(window_h*0.5))+220
    size = 600 400
}

workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

windowrule {
    name = no-gaps-wtv1
    match:float = false
    match:workspace = w[tv1]
    border_size = 0
    rounding = 0
}

windowrule {
    name = no-gaps-f1
    match:float = false
    match:workspace = f[1]
    border_size = 0
    rounding = 0
}

windowrule {
    name = float-thunar-dialogs
    match:class = thunar
    match:title = ^(Rename|Bulk Rename|File Operation Progress|Confirm|Error|Properties|Permissions).*

    float = on
    center = on
}

windowrule {
    name = float-xarchiver
    match:class = xarchiver

    float = on
    center = on
    size = 700 500
}
