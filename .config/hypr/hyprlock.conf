background {
  color = rgb(5, 7, 10)
}

shape {
  size = 1240, 690
  position = 0, 0
  halign = center
  valign = center

  color = rgba(7, 10, 15, 0.58)
  border_color = rgba(127, 143, 126, 0.26)
  border_size = 1
  rounding = 4
}

label {
  text = SESSION LOCKED
  font_family = JetBrainsMono Nerd Font
  font_size = 17
  color = rgba(167, 184, 160, 0.70)

  halign = center
  valign = center
  position = 0, 246
}

label {
  text = $TIME
  font_family = JetBrainsMono Nerd Font
  font_size = 168
  color = rgba(215, 217, 199, 0.94)

  halign = center
  valign = center
  position = 0, 98
}

label {
  text = cmd[update:1000] date +'%d %m %Y  //  %A'
  font_family = JetBrainsMono Nerd Font
  font_size = 28
  color = rgba(154, 161, 143, 0.78)

  halign = center
  valign = center
  position = 0, -34
}

label {
  text = cmd[update:5000] uptime | sed 's/^/UPLINK /'
  font_family = JetBrainsMono Nerd Font
  font_size = 15
  color = rgba(127, 143, 126, 0.72)

  halign = center
  valign = center
  position = 0, -300
}

label {
  text = ACCESS REQUIRED
  font_family = JetBrainsMono Nerd Font
  font_size = 16
  color = rgba(194, 178, 138, 0.80)

  halign = center
  valign = center
  position = 0, -142
}

input-field {
  size = 700, 74

  position = 0, -214
  halign = center
  valign = center

  font_family = JetBrainsMono Nerd Font
  font_size = 21

  font_color = rgba(215, 217, 199, 0.95)

  inner_color = rgba(11, 15, 18, 0.88)
  outer_color = rgba(127, 143, 126, 0.35)

  dots_center = true
  dots_size = 0.34
  dots_spacing = 0.42

  rounding = 3

  outline_thickness = 1

  check_color = rgba(194, 178, 138, 0.95)
  fail_color = rgba(163, 93, 93, 0.95)

  placeholder_text = passphrase
}
